<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>My Thoughts</title>
<style>
  :root{
    --bg:#14100b; --bg-2:#1a150f;
    --surface:#221b13; --surface-2:#2b2219;
    --line:#3d3025; --line-2:#54432f;
    --text:#f2e8d8; --muted:#b9a68c; --dim:#8a7a63;
    --gold:#D9A441; --gold-2:#B8862E;
    --radius:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  @media (prefers-color-scheme:light){
    :root{
      --bg:#f6efe2; --bg-2:#efe5d3;
      --surface:#fffdf8; --surface-2:#f4ead8;
      --line:#e0d0b4; --line-2:#c9b291;
      --text:#2a1f14; --muted:#6d5b45; --dim:#8f7d64;
      --gold:#A9781B; --gold-2:#8A6114;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:16px/1.6 var(--serif);-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(ellipse 900px 480px at 50% -14%, color-mix(in srgb,var(--gold) 10%,transparent), transparent 62%),
                     linear-gradient(180deg,var(--bg-2),var(--bg) 45%);
    background-attachment:fixed;
    min-height:100vh;
  }
  .wrap{max-width:680px;margin:0 auto;padding:56px 22px 90px}

  header{margin-bottom:30px}
  h1{font-size:clamp(1.7rem,4.5vw,2.2rem);line-height:1.1;margin:0 0 8px;
    letter-spacing:-.02em;font-weight:600}
  .tagline{color:var(--muted);margin:0;font-size:.94rem}


  /* ── compact topic list ─────────────────────────────── */
  .topics{display:grid;gap:2px}

  a.topic{
    display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
    padding:15px 4px;text-decoration:none;color:inherit;
    border-bottom:1px solid var(--line);
    transition:padding .16s,background .16s;
  }
  a.topic:hover{background:color-mix(in srgb,var(--gold) 5%,transparent);padding-left:10px}
  a.topic:hover .tt{color:var(--gold)}
  a.topic:hover .arrow{color:var(--gold);transform:translateX(3px)}
  a.topic:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

  .mark{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.5;flex:none}
  a.topic:hover .mark{opacity:1}

  .tmain{min-width:0}
  .tt{font-size:1.02rem;font-weight:600;line-height:1.35;margin:0 0 2px;
    letter-spacing:-.01em;transition:color .16s}
  .td{font-size:.8rem;color:var(--dim);margin:0;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .arrow{color:var(--dim);font-family:var(--mono);font-size:.9rem;transition:color .16s,transform .16s;flex:none}

  .meta{font-family:var(--mono);font-size:.63rem;letter-spacing:.07em;text-transform:uppercase;
    color:var(--dim);margin-bottom:2px}

  footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);
    color:var(--dim);font-size:.72rem;font-family:var(--mono);line-height:1.6}

  @media (max-width:520px){
    .wrap{padding:38px 16px 70px}
    a.topic{padding:13px 2px}
    .td{-webkit-line-clamp:2}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>My Thoughts</h1>
    <p class="tagline">Notes and ideas. Updated when something sticks.</p>
  </header>

  <main class="topics" id="topics">

    <a class="topic" href="pyramids/" data-topics="pyramids">
      <span class="mark"></span>
      <span class="tmain">
        <span class="meta">Interactive · 8 pages</span>
        <div class="tt">The Great Pyramid: how many people?</div>
        <p class="td">Mainstream says 20 years and 20,000–30,000 workers. Measured copper-saw rates say the arithmetic doesn't close.</p>
      </span>
      <span class="arrow">→</span>
    </a>

  </main>

  <footer>
    Private page. Not indexed, not linked.
  </footer>

</div>

<script>
(() => {
  /* single topic for now — nothing to filter */
})();
</script>
</body>
</html>
